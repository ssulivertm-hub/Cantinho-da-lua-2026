<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Cantinho da Lua">
<meta name="theme-color" content="#0b0b24">
<title>Cantinho da Lua 🌙</title>
<style>
:root{color-scheme:dark;--bg:#0a0e24;--card:#141a40;--ink:#f6ead2;--mut:#c2b08a;--acc:#f2c14e;--acc2:#241f52;--line:#8a6a2c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 100% 100%,rgba(232,150,60,.28),transparent 50%),radial-gradient(ellipse at 50% 0,#3a2a78 0%,#141a4a 40%,#0a0e24 75%) fixed;color:var(--ink);font-family:Georgia,'Times New Roman',serif;max-width:560px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:24px;margin:8px 0 2px}
.sub{color:var(--mut);font-size:14px;margin-bottom:14px;font-family:system-ui,sans-serif}
.hello{background:var(--acc2);border-radius:16px;padding:14px 16px;margin-bottom:14px;font-size:15px;line-height:1.45;position:relative}
.hello button{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--mut);font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 2px;font-size:17px}
.card .au{color:var(--mut);font-size:13px;font-family:system-ui,sans-serif;margin-bottom:8px}
.bar{height:8px;background:var(--acc2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;font-family:system-ui,sans-serif;font-size:13px;color:var(--mut)}
.row .sp{flex:1}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;margin-bottom:8px}
textarea{min-height:80px;resize:vertical}
button.pri{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-family:system-ui,sans-serif;width:100%}
button.sm{background:var(--acc2);color:var(--ink);border:0;border-radius:10px;padding:7px 11px;font-size:13px;font-family:system-ui,sans-serif}
button.del{background:none;border:0;color:var(--mut);font-size:13px;font-family:system-ui,sans-serif}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;padding:8px 2px;font-size:12px;color:var(--mut);font-family:system-ui,sans-serif}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--acc);font-weight:600}
.quote{border-left:3px solid var(--acc);padding-left:12px;font-style:italic;line-height:1.45}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:14px;font-family:system-ui,sans-serif}
.big{font-size:44px;text-align:center;margin:10px 0;font-family:system-ui,sans-serif;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-family:system-ui,sans-serif;font-size:12px;color:var(--mut)}
.stats b{display:block;font-size:22px;color:var(--acc);font-family:Georgia,serif}
.stars button{background:none;border:0;font-size:20px;padding:0 2px;color:var(--acc)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{color:#f6e7b0;text-shadow:0 0 14px rgba(242,193,78,.45);line-height:1.15}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 80px,#fff,transparent),radial-gradient(2px 2px at 160px 20px,#f2c14e,transparent),radial-gradient(1px 1px at 60px 140px,#fff,transparent);background-size:200px 180px;animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.3}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes wag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes bob{50%{transform:translateY(-3px)}}
.hdsvg{flex:none;filter:drop-shadow(0 0 12px rgba(246,231,176,.45))}
.hdsvg .tail{transform-box:fill-box;transform-origin:0 100%;animation:wag 2.4s ease-in-out infinite}
.hdsvg .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.card,.hello,.stats div{border:1px solid #8a6a2c;box-shadow:0 10px 24px rgba(0,0,0,.5),inset 0 0 0 3px #141a40,inset 0 0 0 4px rgba(242,193,78,.4);animation:rise .5s both}
.card{background:linear-gradient(160deg,#1a2152,#121740)}
.hello{background:linear-gradient(160deg,#2b2266,#1a1d52)}
button{cursor:pointer}
button.pri{border-radius:14px;color:#2b1a05;font-weight:700;background:linear-gradient(180deg,#ffe29a,#e0a93a);box-shadow:0 6px 0 #8a5a14,0 10px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.7);transition:transform .12s,box-shadow .12s}
button.sm{border-radius:12px;color:#fff;font-weight:600;background:linear-gradient(180deg,#9a73e8,#6a3fc0);box-shadow:0 4px 0 #3b1f80,0 8px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s,box-shadow .12s}
button.pri:active{transform:translateY(5px);box-shadow:0 1px 0 #8a5a14,0 3px 6px rgba(0,0,0,.5)}
button.sm:active{transform:translateY(3px);box-shadow:0 1px 0 #3b1f80,0 3px 6px rgba(0,0,0,.5)}
input:focus,textarea:focus{outline:0;box-shadow:0 0 0 2px #f2c14e,0 0 14px rgba(242,193,78,.4)}
.bar{background:#0a0e24;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.bar i{background:linear-gradient(90deg,#7b4fc9,#f2c14e);box-shadow:0 0 10px rgba(242,193,78,.6);transition:width .6s}
nav{background:linear-gradient(180deg,#141a40,#0a0e24);border-top:1px solid #8a6a2c;box-shadow:0 -6px 18px rgba(0,0,0,.5)}
nav button.on b{animation:bob 1.8s ease-in-out infinite;filter:drop-shadow(0 0 6px #f2c14e)}
.quote{border-left-color:#f2c14e}
.big{color:#f6e7b0;text-shadow:0 0 16px rgba(242,193,78,.5)}
.locked .hd,.locked .sub,.locked #view,.locked nav{display:none}
.lockbox{margin-top:7vh;text-align:center;padding:20px 18px}
.lockbox svg{width:170px;height:auto}
.lockbox h2{color:#f6e7b0;margin:6px 0;text-shadow:0 0 12px rgba(242,193,78,.4)}
.lockbox p{color:var(--mut);font-family:system-ui,sans-serif;font-size:14px;line-height:1.4}
.err{color:#ff9a9a;font-size:13px;margin:4px 0 10px;min-height:16px;font-family:system-ui,sans-serif}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.links a{font-family:system-ui,sans-serif;font-size:13px;color:#2b1a05;text-decoration:none;font-weight:600;padding:8px 12px;border-radius:12px;background:linear-gradient(180deg,#ffe29a,#e0a93a);box-shadow:0 4px 0 #8a5a14,0 8px 14px rgba(0,0,0,.5);transition:transform .12s,box-shadow .12s}
.links a:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5a14}
button:disabled{opacity:.6}
.nw{font-size:14px;line-height:1.45;margin:6px 0;font-family:system-ui,sans-serif}
.src{color:var(--acc);font-size:12px;margin-left:4px}
nav button{font-size:11px}
.lvmsg{margin-top:12vh;text-align:center;font-size:21px;line-height:1.7;color:#f6e7b0;text-shadow:0 0 14px rgba(242,193,78,.5);white-space:pre-line;min-height:150px;transition:opacity 1.2s;padding:0 8px}
.lvmsg.out{opacity:0}
.pg{position:absolute;inset:0;overflow:auto;padding:26px 22px 30px 32px;color:#3a2a14;font-size:15.5px;line-height:1.55;border-radius:3px 10px 10px 3px;backface-visibility:hidden;background:linear-gradient(90deg,rgba(90,60,20,.28),rgba(90,60,20,0) 9%),#f6ecd2;box-shadow:inset -3px 0 6px rgba(120,90,40,.25)}
.pg h4{margin:0 0 14px;text-align:center;font-style:italic;font-size:18px;color:#7a4a1a;line-height:1.3}
.pg p{margin:0 0 .75em}
.pg .fim{text-align:center;font-style:italic;color:#9a6a2a;margin-top:18px}
.pg .num{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:#a08a5a;font-family:system-ui,sans-serif}
.pg .ded{min-height:100%;display:flex;flex-direction:column;justify-content:center;text-align:center;font-style:italic}
.fl{z-index:3;transform-origin:left center;transition:transform 1s cubic-bezier(.55,0,.3,1),filter 1s;box-shadow:-10px 0 24px rgba(0,0,0,.35)}
.fl.go{filter:brightness(.75)}
.nv{display:flex;align-items:center;justify-content:center;gap:14px;font-family:system-ui,sans-serif;font-size:13px;color:var(--mut)}

.lvbtn{margin-top:22px;animation:rise .9s both;transition:opacity .5s}
.stage{animation:rise .9s both}
.scene{perspective:1800px;padding:26px 0 14px}
.scene.fl3{animation:flt 3.2s ease-in-out infinite alternate}
@keyframes flt{to{transform:translateY(-9px)}}
.bk{position:relative;width:min(78%,400px);aspect-ratio:2/3;margin:0 auto;transform-style:preserve-3d;transition:transform 1.9s cubic-bezier(.45,0,.2,1)}
.bk.ang{transform:rotateX(-14deg) rotateY(-32deg) scale(.88)}
.bk>div{position:absolute}
.bb{inset:-5px -7px -5px -5px;transform:translateZ(-14px);background:#1a1040;border-radius:6px 12px 12px 6px;box-shadow:0 30px 40px rgba(0,0,0,.65)}
.edr,.edt,.sp3{background:repeating-linear-gradient(90deg,#f6ecd2 0 2px,#cdb98a 2px 3px)}
.edr{top:0;right:-3px;width:28px;height:100%;transform-origin:right center;transform:translateZ(14px) rotateY(-90deg)}
.edt{top:-3px;left:0;width:100%;height:28px;transform-origin:center top;transform:translateZ(14px) rotateX(-90deg);background:repeating-linear-gradient(0deg,#f6ecd2 0 2px,#cdb98a 2px 3px)}
.sp3{top:-5px;bottom:-5px;left:-5px;width:28px;transform-origin:left center;transform:translateZ(14px) rotateY(90deg);background:linear-gradient(90deg,#160d38,#4b2f8a 50%,#160d38);box-shadow:inset 0 0 0 2px #f2c14e}
.cv{inset:-5px -7px -5px -5px;z-index:5;transform-origin:left center;transform:translateZ(14px);transition:transform 1.5s cubic-bezier(.5,0,.2,1);border-radius:6px 12px 12px 6px;overflow:hidden;backface-visibility:hidden;cursor:pointer;background:#2a1b60;box-shadow:inset 0 0 0 2px #f2c14e}
.cv.open{transform:translateZ(14px) rotateY(-178deg)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,.22),transparent 35%,rgba(0,0,0,.25) 100%),linear-gradient(90deg,rgba(0,0,0,.45),transparent 7%)}
.bk .pg{transform:translateZ(0)}
.hint{text-align:center;font-family:system-ui,sans-serif;font-size:13px;color:var(--mut);min-height:20px;margin-top:6px}
.fx{position:fixed;z-index:50;pointer-events:none;color:#f6e7b0;text-shadow:0 0 8px #f2c14e;animation:fxm 1.9s var(--d) ease-out both}
@keyframes fxm{0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(220deg)}}

.pg .ded{font-size:14.5px;line-height:1.5}
.pg .magic{position:relative;overflow:hidden;font-family:Georgia,serif;font-style:italic;font-size:16px;color:#7a4a1a;background:rgba(255,240,190,.35);border:1px solid #c9a24a;border-radius:99px;padding:9px 24px;text-shadow:0 0 6px rgba(242,193,78,.8);box-shadow:0 0 10px rgba(201,162,74,.5);animation:mg 2s ease-in-out infinite alternate}
.pg .magic::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,244,190,.9),transparent);animation:sh 2.4s infinite}
@keyframes mg{to{box-shadow:0 0 24px rgba(242,193,78,1);color:#a0651a}}
@keyframes sh{to{left:130%}}
.skip{display:block;margin:18px auto 0;background:none;border:0;color:var(--mut);font:13px system-ui,sans-serif;text-decoration:underline;opacity:.85}
nav button.book{position:relative;color:#ffe9a0;font-weight:700}
nav button.book::before{content:"";position:absolute;left:50%;top:0;width:58px;height:58px;margin-left:-29px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,120,.9),rgba(242,193,78,0) 70%);animation:pulseb 1.5s ease-in-out infinite}
nav button.book::after{content:"✨";position:absolute;top:0;right:14%;font-size:13px;animation:tw .9s ease-in-out infinite alternate}
nav button.book b,nav button.book.on b{position:relative;animation:bkglow 1.5s ease-in-out infinite alternate}
@keyframes pulseb{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}
@keyframes bkglow{from{filter:drop-shadow(0 0 4px #f2c14e);transform:scale(1)}to{filter:drop-shadow(0 0 8px #fff2b0) drop-shadow(0 0 20px #f2c14e);transform:scale(1.2)}}
.gift{text-align:center;padding:20px 14px 16px;margin-bottom:14px;border-radius:18px;background:radial-gradient(circle at 50% 30%,rgba(242,193,78,.22),transparent 65%),linear-gradient(160deg,#2b2266,#1a1d52);border:1px solid #8a6a2c;box-shadow:0 10px 24px rgba(0,0,0,.5),inset 0 0 0 3px #141a40,inset 0 0 0 4px rgba(242,193,78,.4);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.gbox{font-size:72px;line-height:1;display:inline-block;transform:scale(var(--s,1));filter:drop-shadow(0 0 14px rgba(242,193,78,.75));animation:gbob 1.8s ease-in-out infinite alternate}
@keyframes gbob{to{transform:scale(var(--s,1)) translateY(-6px) rotate(3deg)}}
.gbox.hit{animation:ghit .45s}
@keyframes ghit{0%{transform:scale(var(--s)) rotate(0)}25%{transform:scale(calc(var(--s)*1.18)) rotate(-12deg)}50%{transform:scale(calc(var(--s)*1.1)) rotate(10deg)}75%{transform:scale(var(--s)) rotate(-5deg)}100%{transform:scale(var(--s)) rotate(0)}}
.gbox.pop{animation:gpop .75s forwards}
@keyframes gpop{to{transform:scale(2.6) rotate(18deg);opacity:0}}
.gdots{display:flex;gap:6px;justify-content:center;margin:12px 0 6px}
.gdots i{width:9px;height:9px;border-radius:50%;background:#3a3470;transition:.3s}
.gdots i.on{background:#f2c14e;box-shadow:0 0 8px #f2c14e}
.gtx{font-size:14px;color:#f6e7b0}
.rose{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 50%,rgba(34,24,78,.95),rgba(8,6,24,.98));opacity:0;transition:opacity .7s;overflow:hidden}
.rose.in{opacity:1}
.rr{position:absolute;left:0;top:0;will-change:transform}
.rr svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
.rstem{position:absolute;left:0;top:0;opacity:0;transition:opacity 1.2s}
.rtxt{position:absolute;left:0;right:0;top:20px;text-align:center;font:italic 32px Georgia,serif;color:#f6e7b0;text-shadow:0 0 18px rgba(242,193,78,.85);padding:0 16px;min-height:40px}
.rclose{position:absolute;bottom:6vh;left:50%;transform:translateX(-50%);opacity:0;transition:opacity 1s}
#fs{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.fs{position:absolute;top:0;left:0;border-radius:50%;background:#fff6d0;box-shadow:0 0 6px 1px rgba(255,236,160,.8);opacity:0;will-change:transform,opacity;animation:fsf var(--f) linear infinite,fst var(--t) ease-in-out infinite alternate;animation-delay:var(--d),var(--d)}
.fs.g{background:none;box-shadow:none;color:#ffe9a0;text-shadow:0 0 6px rgba(255,226,120,.9);line-height:1}
@keyframes fsf{from{transform:translate(0,108vh)}50%{transform:translate(var(--x),50vh)}to{transform:translate(0,-8vh)}}
@keyframes fst{from{opacity:.05}to{opacity:var(--o)}}
@media (prefers-reduced-motion:reduce){.fs{animation:none;opacity:.25;transform:translate(0,50vh)}}
#moon{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:10px;z-index:30;width:40px;height:40px;padding:0;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6f748e,#2b2f48 72%);box-shadow:inset -4px -4px 8px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08);animation:bob 3.2s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
#moon .lit{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffbe0,#f6d36b 60%,#e0a93a);box-shadow:0 0 26px 8px rgba(255,226,120,.85);opacity:var(--g,0);transition:opacity .35s}
#moon::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 62% 38%,rgba(0,0,0,.2) 0 4px,transparent 5px),radial-gradient(circle at 38% 66%,rgba(0,0,0,.18) 0 5px,transparent 6px),radial-gradient(circle at 70% 70%,rgba(0,0,0,.15) 0 3px,transparent 4px)}
#moon.hit{animation:mhit .3s}
@keyframes mhit{50%{transform:scale(1.25) rotate(-8deg)}}
#moon.pifa .lit{animation:pifa 2s steps(1) forwards}
@keyframes pifa{0%{opacity:1}12%{opacity:.25}22%{opacity:1}34%{opacity:0}46%{opacity:.7}58%{opacity:.1}70%{opacity:.5}82%{opacity:0}100%{opacity:0}}
#mbub{position:fixed;top:calc(54px + env(safe-area-inset-top,0px));right:10px;z-index:31;max-width:min(250px,80vw);padding:12px 14px;border-radius:14px;background:linear-gradient(160deg,#2b2266,#1a1d52);border:1px solid #8a6a2c;box-shadow:0 10px 24px rgba(0,0,0,.55);color:#f6e7b0;font-size:14px;line-height:1.45;opacity:0;pointer-events:none;transform:translateY(-6px);transition:.5s}
#mbub.on{opacity:1;pointer-events:auto;transform:none}
#mbub::before{content:"";position:absolute;top:-7px;right:16px;width:12px;height:12px;background:#2b2266;border-left:1px solid #8a6a2c;border-top:1px solid #8a6a2c;transform:rotate(45deg)}
.wc{position:fixed;inset:0;z-index:150;overflow:hidden;background:linear-gradient(#04061a,#10163f 45%,#2a1f5a 46%,#0a0c20);opacity:0;transition:opacity .6s}
.wc.in{opacity:1}
.wsky{position:absolute;inset:0 0 54% 0;background:radial-gradient(1.5px 1.5px at 12% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 48%,#fff,transparent),radial-gradient(1.5px 1.5px at 58% 14%,#fff,transparent),radial-gradient(1px 1px at 78% 36%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 12%,#fff,transparent),radial-gradient(1px 1px at 44% 28%,#fff,transparent)}
.wmoon{position:absolute;top:9%;right:12%;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffbe0,#f6d36b 65%,#e0a93a);box-shadow:0 0 40px 12px rgba(255,226,120,.45)}
.wcity{position:absolute;left:0;width:100%;top:calc(46% - 70px);height:70px;transform-origin:50% 100%;animation:cityz 3.8s ease-out forwards}
@keyframes cityz{from{transform:scale(1)}to{transform:scale(1.18)}}
.wsc{position:absolute;inset:0;perspective:700px;perspective-origin:50% 50%}
.road{position:absolute;left:50%;top:46%;width:560px;margin-left:-280px;height:520px;transform-origin:50% 0;transform:rotateX(74deg);background:linear-gradient(#222238,#0b0b16);border-left:6px solid #3a3a58;border-right:6px solid #3a3a58;box-shadow:0 0 80px rgba(255,200,90,.12)}
.lane{position:absolute;left:50%;margin-left:-6px;width:12px;top:0;bottom:0;background:repeating-linear-gradient(180deg,#f6e7b0 0 60px,transparent 60px 140px);animation:lane 3.8s cubic-bezier(.15,.6,.2,1) forwards}
@keyframes lane{from{background-position:0 0}to{background-position:0 1400px}}
.car{position:absolute;left:50%;bottom:10%;width:min(82vw,380px);margin-left:calc(min(82vw,380px)/-2);transform:translateZ(-3800px);transform-origin:50% 100%}
.car.go{transition:transform 3.7s cubic-bezier(.12,.55,.2,1);transform:translateZ(0)}
.carb{position:relative}
.carb svg{width:100%;display:block;filter:drop-shadow(0 14px 14px rgba(0,0,0,.7))}
.park .carb{animation:nod .8s ease-out}
@keyframes nod{30%{transform:rotateX(5deg) translateY(4px)}60%{transform:rotateX(-2deg)}}
.beam{position:absolute;left:-12%;right:-12%;bottom:-22%;height:62%;background:radial-gradient(ellipse at 50% 25%,rgba(255,250,215,.6),transparent 68%);filter:blur(7px);opacity:0;animation:beam 3.8s forwards}
@keyframes beam{to{opacity:1}}
.glow{opacity:.65}
.park .glow{animation:hlf .45s 3}
@keyframes hlf{50%{opacity:1;transform:scale(1.6)}}

<body class="locked">
<div class="hd"><h1>Cantinho<br>da Lua</h1><svg class="hdsvg" viewBox="0 0 150 120" width="130" height="104" aria-hidden="true"><circle cx="75" cy="58" r="44" fill="#f6e7b0"/><circle cx="58" cy="44" r="7" fill="#e3cf94"/><circle cx="92" cy="70" r="9" fill="#e3cf94"/><circle cx="88" cy="38" r="4" fill="#e3cf94"/><g fill="#05060f"><ellipse cx="75" cy="94" rx="19" ry="22"/><circle cx="75" cy="66" r="14"/><polygon points="63,58 65,42 74,54"/><polygon points="87,58 85,42 76,54"/><rect x="30" y="112" width="90" height="5" rx="2.5"/></g><path class="tail" d="M92 108 C116 108 120 84 108 80" stroke="#05060f" stroke-width="7" fill="none" stroke-linecap="round"/><g class="eyes" fill="#f2c14e"><ellipse cx="69" cy="66" rx="2.4" ry="3.6"/><ellipse cx="81" cy="66" rx="2.4" ry="3.6"/></g></svg></div>
<div class="sub" id="sub"></div>
<div id="view"></div><div id="lock"></div>
<nav id="nav"></nav>
<script>
var S={authors:['Sarah J. Maas','Rebecca Yarros','Cassandra Clare'],books:[],quotes:[],wish:[],hello:true,tab:'lendo',read:0};
function load(){try{var r=localStorage.getItem('cantinho');if(r){var d=JSON.parse(r);for(var k in d)S[k]=d[k];}}catch(e){}}
function save(){try{localStorage.setItem('cantinho',JSON.stringify(S));}catch(e){}mirror();}
load();
var timer=null,secs=0;
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
function $(id){return document.getElementById(id);}
var tabs=[['lendo','🌙','Lendo'],['frases','✨','Frases'],['quero','🐈‍⬛','Quero ler'],['sug','📚','Sugestões'],['news','📰','Notícias'],['foco','⏱️','Foco'],['livro','📖','Livro']];
function nav(){$('nav').innerHTML=tabs.map(function(t){return '<button class="'+(S.tab===t[0]?'on':'')+(t[0]==='livro'?' book':'')+'" onclick="go(\''+t[0]+'\')"><b>'+t[1]+'</b>'+t[2]+'</button>';}).join('');}
function go(t){S.tab=t;save();render();}
function render(){
  nav();
  var done=S.books.filter(function(b){return b.page>=b.total&&b.total>0;}).length;
  $('sub').innerHTML=greet()+', Lua! Este cantinho é todo seu. 🌙 <button class="sm" style="padding:4px 9px;margin-left:6px" onclick="lockScreen()">🔒 Bloquear</button>';
  var h=giftHtml();
  if(S.hello&&S.tab==='lendo')h+='<div class="hello"><button onclick="S.hello=false;save();render()">×</button>🌙🐈‍⬛ <b>Feliz aniversário, Luiza!</b><br>Lua, este cantinho foi feito só para você: para guardar as suas leituras, as suas frases favoritas e os livros que ainda vão te conquistar. Boas histórias, hoje e sempre!</div>';
  if(S.tab==='lendo')h+=lendo(done);
  if(S.tab==='frases')h+=frases();
  if(S.tab==='quero')h+=quero();
  if(S.tab==='sug')h+=sug();
  if(S.tab==='news')h+=news();
  if(S.tab==='foco')h+=foco();
  if(S.tab==='livro')h+=livro();
  if(S.tab==='lendo')h+=bkHtml();
  $('view').innerHTML=h;
  if(S.tab==='livro')livroInit();
}
function lendo(done){
  var h='<div class="stats"><div><b>'+S.books.length+'</b>livros</div><div><b>'+done+'</b>terminados</div><div><b>'+S.quotes.length+'</b>frases</div></div>';
  h+='<div class="card"><input id="bt" placeholder="Título do livro"><input id="ba" placeholder="Autor(a)"><input id="bp" type="number" inputmode="numeric" placeholder="Total de páginas"><button class="pri" onclick="addBook()">Adicionar livro</button></div>';
  if(!S.books.length)h+='<div class="empty">Nenhum livro ainda. Que tal começar pelo que está na sua mesa de cabeceira?</div>';
  S.books.forEach(function(b,i){
    var pc=b.total?Math.min(100,Math.round(b.page/b.total*100)):0;
    var fin=b.total&&b.page>=b.total;
    h+='<div class="card"><h3>'+esc(b.t)+(fin?' ✅':'')+'</h3><div class="au">'+esc(b.a||'')+'</div><div class="bar"><i style="width:'+pc+'%"></i></div><div class="row"><span>pág. '+b.page+' de '+b.total+' · '+pc+'%</span><span class="sp"></span><button class="sm" onclick="upd('+i+')">Atualizar</button><button class="del" onclick="rm('+i+')">remover</button></div>';
    if(fin){h+='<div class="stars" style="margin-top:6px">'+[1,2,3,4,5].map(function(n){return '<button onclick="rate('+i+','+n+')">'+(n<=(b.r||0)?'★':'☆')+'</button>';}).join('')+'</div>';}
    h+='</div>';
  });
  return h;
}
function addBook(){var t=$('bt').value.trim();if(!t)return;S.books.unshift({t:t,a:$('ba').value.trim(),total:parseInt($('bp').value)||0,page:0,r:0});save();render();}
function upd(i){var v=prompt('Em que página você está?',S.books[i].page);if(v===null)return;var n=parseInt(v);if(isNaN(n)||n<0)return;S.books[i].page=S.books[i].total?Math.min(n,S.books[i].total):n;save();render();}
function rate(i,n){S.books[i].r=n;save();render();}
function rm(i){if(confirm('Remover este livro?')){S.books.splice(i,1);save();render();}}
function frases(){
  var h='<div class="card"><textarea id="qt" placeholder="Uma frase que te marcou..."></textarea><input id="qs" placeholder="De qual livro?"><button class="pri" onclick="addQ()">Guardar frase</button></div>';
  if(!S.quotes.length)h+='<div class="empty">Sua coleção de frases favoritas aparece aqui.</div>';
  else{h+='<button class="sm" style="margin-bottom:12px" onclick="rand()">🎲 Frase aleatória</button><div id="rq"></div>';}
  S.quotes.forEach(function(q,i){h+='<div class="card"><div class="quote">“'+esc(q.t)+'”</div><div class="row"><span>'+esc(q.s||'')+'</span><span class="sp"></span><button class="del" onclick="rmQ('+i+')">remover</button></div></div>';});
  return h;
}
function addQ(){var t=$('qt').value.trim();if(!t)return;S.quotes.unshift({t:t,s:$('qs').value.trim()});save();render();}
function rmQ(i){S.quotes.splice(i,1);save();render();}
function rand(){var q=S.quotes[Math.floor(Math.random()*S.quotes.length)];$('rq').innerHTML='<div class="hello"><div class="quote">“'+esc(q.t)+'”</div><div style="margin-top:6px;font-size:13px;color:var(--mut)">'+esc(q.s||'')+'</div></div>';}
function quero(){
  var h='<div class="card"><input id="wt" placeholder="Livro que quero ler"><input id="wn" placeholder="Quem indicou? (opcional)"><button class="pri" onclick="addW()">Adicionar à lista</button></div>';
  if(!S.wish.length)h+='<div class="empty">Sua lista de desejos está vazia.</div>';
  S.wish.forEach(function(w,i){h+='<div class="card"><h3>'+esc(w.t)+'</h3>'+(w.n?'<div class="au">indicado por '+esc(w.n)+'</div>':'')+'<div class="row"><button class="sm" onclick="start('+i+')">Começar a ler</button><span class="sp"></span><button class="del" onclick="rmW('+i+')">remover</button></div></div>';});
  return h;
}
function addW(){var t=$('wt').value.trim();if(!t)return;S.wish.unshift({t:t,n:$('wn').value.trim()});save();render();}
function rmW(i){S.wish.splice(i,1);save();render();}
function start(i){var w=S.wish.splice(i,1)[0];S.books.unshift({t:w.t,a:'',total:0,page:0,r:0});S.tab='lendo';save();render();}
function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function foco(){
  return '<div class="card"><div class="sub" style="text-align:center">Cronômetro de leitura</div><div class="big" id="clk">'+fmt(secs)+'</div><div style="display:flex;gap:8px"><button class="pri" onclick="tog()" id="tb">'+(timer?'Pausar':'Começar')+'</button><button class="sm" onclick="fin()">Finalizar</button></div></div><div class="card"><div class="sub" style="margin:0">Total lido com o cronômetro</div><div class="big" style="font-size:30px">'+Math.round(S.read/60)+' min</div></div>';
}
function tog(){if(timer){clearInterval(timer);timer=null;}else{timer=setInterval(function(){secs++;var c=$('clk');if(c)c.textContent=fmt(secs);},1000);}render();}
function fin(){if(timer){clearInterval(timer);timer=null;}S.read+=secs;secs=0;save();render();}
function greet(){var h=new Date().getHours();return h<5?'Boa madrugada':h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';}
async function sha(t){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('lua:'+t));return Array.from(new Uint8Array(b)).map(function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}
function getPw(){try{return localStorage.getItem('cantinho_pw');}catch(e){return null;}}
function lockScreen(msg){
  var first=!getPw();
  document.body.classList.add('locked');
  $('lock').innerHTML=`<div class='lockbox card'>${document.querySelector('.hdsvg').outerHTML}<h2>Cantinho da Lua</h2><p>${first?'Oi, Luiza! 🌙 Crie uma senha só sua para proteger o seu cantinho.':'Oi, Luiza! Digite sua senha para entrar.'}</p><input id='pw' type='password' placeholder='${first?'Crie sua senha (mín. 4 caracteres)':'Sua senha'}' autocomplete='off'>${first?`<input id='pw2' type='password' placeholder='Repita a senha'>`:''}<div class='err' id='err'>${msg||''}</div><button class='pri' onclick='doLogin()'>${first?'Criar senha e entrar':'Entrar 🌙'}</button>${instHtml()}</div>`;
}
async function doLogin(){
  var p=$('pw').value,first=!getPw();
  if(first){
    if(p.length<4){$('err').textContent='A senha precisa ter pelo menos 4 caracteres.';return;}
    if(p!==$('pw2').value){$('err').textContent='As senhas não são iguais.';return;}
    try{localStorage.setItem('cantinho_pw',await sha(p));mirror();}catch(e){}
  }else if((await sha(p))!==getPw()){$('err').textContent='Senha incorreta. Tente de novo.';return;}
  document.body.classList.remove('locked');$('lock').innerHTML='';render();setTimeout(welcomeCar,300);
}
var sugs=[],sugBusy=false,sugErr='';
function sug(){
  var h=`<div class='card'><h3>Sugestões para você, Lua 🌙</h3><div class='au'>Escolhidas pela Claude a partir dos livros que você cadastrou e das notas que deu.</div><button class='pri' onclick='getSug()' ${sugBusy?'disabled':''}>${sugBusy?'Lendo os seus livros...':(sugs.length?'Pedir novas sugestões':'Pedir sugestões')}</button>${sugErr?`<div class='err' style='margin-top:8px'>${esc(sugErr)}</div>`:''}</div>`;
  if(!S.books.length)h+=`<div class='empty'>Cadastre alguns livros na aba Lendo para eu conhecer o seu gosto.</div>`;
  sugs.forEach(function(s,i){
    var q=encodeURIComponent(s.titulo+' '+(s.autor||''));
    h+=`<div class='card'><h3>${esc(s.titulo)}</h3><div class='au'>${esc(s.autor||'')}</div><div style='font-size:14px;line-height:1.45'>${esc(s.motivo||'')}</div><div class='links'><a href='https://www.amazon.com.br/s?k=${q}' target='_blank' rel='noopener noreferrer'>Amazon</a><a href='https://www.estantevirtual.com.br/busca?q=${q}' target='_blank' rel='noopener noreferrer'>Estante Virtual</a><a href='https://www.google.com/search?tbm=shop&q=${q}' target='_blank' rel='noopener noreferrer'>Comparar preços</a></div><div class='row'><button class='sm' onclick='wishSug(${i})'>🐈 Quero ler</button></div></div>`;
  });
  return h;
}
function wishSug(i){var s=sugs[i];if(!s)return;S.wish.unshift({t:s.titulo,n:'sugestão da Claude'});sugs.splice(i,1);save();render();}
async function getSug(){
  if(!S.books.length){sugErr='Cadastre ao menos um livro primeiro.';render();return;}
  var sample=null;try{sample=await claude.use('sample');}catch(e){}
  if(!sample){sugErr='As sugestões não estão disponíveis neste momento.';render();return;}
  sugBusy=true;sugErr='';render();
  var lista=S.books.map(function(b){return '- '+b.t+(b.a?' ('+b.a+')':'')+(b.r?' nota '+b.r+'/5':'')+(b.total&&b.page>=b.total?' [terminado]':'');}).join('\n');
  var ja=S.books.concat(S.wish).map(function(b){return b.t;}).join('; ');
  try{
    var r=await sample.json(`Você é uma bibliotecária atenciosa. A leitora se chama Luiza (Lua). Estes são os livros dela:\n${lista}\n\nSugira 6 livros reais, publicados e disponíveis em português do Brasil, que combinem com o gosto dela, sem repetir estes títulos: ${ja}. Responda APENAS um array JSON, sem texto extra, de objetos com as chaves titulo, autor e motivo (uma frase curta em português dizendo por que combina com ela). Use só títulos e autores que você tem certeza que existem.`);
    sugs=Array.isArray(r)?r.filter(function(x){return x&&x.titulo;}):[];
    if(!sugs.length)sugErr='Não consegui montar sugestões agora. Tente de novo.';
  }catch(e){sugErr=(e&&e.code==='not_granted')?'Para receber sugestões, permita o acesso quando o app pedir.':'Não consegui buscar sugestões agora. Tente de novo em instantes.';}
  sugBusy=false;render();
}
var NEWS={
 'sarah j. maas':[
  {t:'O livro 6 de ACOTAR estava marcado para 27/10/2026 e o livro 7 para 12/01/2027, depois de mais de cinco anos sem novos volumes da série.',s:'AP',u:'https://www.wsls.com/entertainment/2026/03/06/after-5-years-sarah-j-maas-returns-to-a-court-of-thorns-and-roses-with-2-untitled-books/'},
  {t:'Os títulos e as capas dos dois novos livros foram revelados no Instagram dela em agosto.',s:'ABC News',u:'https://abcnews.com/GMA/Culture/sarah-maas-unveils-titles-book-covers-2-installments/story?id=135715326'}],
 'rebecca yarros':[
  {t:'Threshing Day, coleânea com 13 histórias do universo Empyrean (não é o livro 4), foi lançada em 29/09/2026.',s:'Rising Shadow',u:'https://risingshadow.net/articles/fandom/1137-rebecca-yarros-threshing-day-release-date-and-story-details'},
  {t:'O livro 4 da série segue em escrita, sem data oficial divulgada nas últimas notícias.',s:'Winter Is Coming',u:'https://winteriscoming.net/4-fourth-wing-book-4-reveals-you-missed-rebecca-yarros-latest-events'}],
 'cassandra clare':[
  {t:'The Last King of Faerie, primeiro livro de The Wicked Powers (a trilogia final dos Shadowhunters), tem lançamento em 03/11/2026.',s:'Books of Brilliance',u:'https://booksofbrilliance.com/2026/11/01/the-last-king-of-faerie-cassandra-clare/'},
  {t:'O audiolivro é narrado por James Marsters, ator de Buffy, a Caça-Vampiros.',s:'Book Riot',u:'https://bookriot.com/?p=652267'},
  {t:'Os próximos da trilogia são The Last Prince of Hell e The Last Shadowhunter; depois vem a duologia In Fire Foretold.',s:'Winter Is Coming',u:'https://winteriscoming.net/posts/cassandra-clare-announces-final-trilogy-in-the-shadowhunters-series-and-a-brand-new-duology-01htqp7m5z7x'}]
};
var SITES={'sarah j. maas':'https://sarahjmaas.com','rebecca yarros':'https://www.rebeccayarros.com','cassandra clare':'https://www.cassandraclare.com'};
var sg=[];
function nlink(days,en){var qs=S.authors.map(function(a){return '"'+a+'"';}).join(' OR ');return 'https://news.google.com/search?q='+encodeURIComponent('('+qs+') when:'+days)+(en?'&hl=en-US&gl=US&ceid=US:en':'&hl=pt-BR&gl=BR&ceid=BR:pt-419');}
function hoje(){return new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});}
function nk(a){return String(a).toLowerCase().trim();}
function news(){
  var h=`<div class='card'><h3>Notícias dos seus autores 📰</h3><div class='au'>Hoje é ${hoje()}. Toque para ver o que saiu sobre os seus autores, sempre atualizado. O resumo abaixo é de 12/11/2026.</div><div class='links' style='margin-bottom:10px'><a href='${nlink('1d')}' target='_blank' rel='noopener noreferrer'>🔄 Hoje (PT)</a><a href='${nlink('1d',1)}' target='_blank' rel='noopener noreferrer'>🔄 Hoje (EN)</a><a href='${nlink('7d')}' target='_blank' rel='noopener noreferrer'>7 dias (PT)</a><a href='${nlink('7d',1)}' target='_blank' rel='noopener noreferrer'>7 dias (EN)</a></div><input id='na' placeholder='Seguir outro autor ou autora'><button class='pri' onclick='addAuthor()'>Seguir</button></div>`;
  sg=[];S.books.forEach(function(b){var a=(b.a||'').trim();if(a&&!S.authors.some(function(x){return nk(x)===nk(a);})&&!sg.some(function(x){return nk(x)===nk(a);}))sg.push(a);});
  if(sg.length)h+=`<div class='card'><div class='au'>Autores dos seus livros:</div><div class='links'>${sg.map(function(a,i){return `<a href='#' onclick='followA(${i});return false'>+ ${esc(a)}</a>`;}).join('')}</div></div>`;
  S.authors.forEach(function(a,i){
    var q=encodeURIComponent('"'+a+'"'),it=NEWS[nk(a)]||[],off=SITES[nk(a)];
    h+=`<div class='card'><h3>${esc(a)}</h3>${it.length?it.map(function(n){return `<div class='nw'>• ${esc(n.t)} <a class='src' href='${n.u}' target='_blank' rel='noopener noreferrer'>${esc(n.s)}</a></div>`;}).join(''):`<div class='nw'>Toque nos botões para ver as últimas notícias.</div>`}<div class='links'><a href='https://news.google.com/search?q=${q}&hl=pt-BR&gl=BR&ceid=BR:pt-419' target='_blank' rel='noopener noreferrer'>Notícias (PT)</a><a href='https://news.google.com/search?q=${q}&hl=en-US&gl=US&ceid=US:en' target='_blank' rel='noopener noreferrer'>News (EN)</a>${off?`<a href='${off}' target='_blank' rel='noopener noreferrer'>Site oficial</a>`:''}</div><div class='row'><span class='sp'></span><button class='del' onclick='unfollow(${i})'>deixar de seguir</button></div></div>`;
  });
  return h;
}
function addAuthor(){var v=$('na').value.trim();if(!v||S.authors.some(function(x){return nk(x)===nk(v);}))return;S.authors.push(v);save();render();}
function followA(i){if(sg[i]){S.authors.push(sg[i]);save();render();}}

var BOOKTITLE='A Bruxa da Lua<br>e o Gato<br>das Sete Luas';
var DED1=`<h4>Dedicatória</h4><p><i>Para a Lua.</i></p><p>Esta história nasceu de um desejo simples: te dar um lugar onde a magia fosse real, onde os gatos fossem reis e o amor demorasse só o suficiente para valer cada página.</p><p>Cada linha foi escrita pensando em você. 🌙</p>`;
var DED2=`<h4>Para você, Lua</h4><p>Se eu pudesse escolher um feitiço, não seria para voar nem para parar o tempo. Seria para você se ver pelos meus olhos, só por um minuto. Você veria a pessoa que se tornou: corajosa nos dias difíceis, generosa sem fazer alarde, bonita de um jeito que não cabe em espelho.</p><p>Eu me orgulho muito de você. Do caminho que fez, das vezes que caiu e levantou, de cada escolha que te trouxe até aqui. Seja qual for o próximo capítulo, você já é uma história que vale a pena ler.</p><p>Que você tenha sempre um cantinho onde a lua seja baixa o bastante para tocar. E nunca se esqueça: a magia nunca foi o que acontece nos livros. Sempre foi você.</p><p><i>Com todo o meu carinho. 🌙</i></p><p><button class="magic" onclick="lvClose()">✦ Fechar livro ✦</button></p>`;

`## Capítulo 1 · A livraria que ronronava
Na Vila das Lanternas, onde a lua descia tão baixa que dava para tocá-la com a ponta dos dedos, existia uma livraria que ronronava.
Não era figura de linguagem: quando a porta se abria, o chão inteiro vibrava, como se as estantes fossem um gato gigante dormindo ao sol.
Dentro dela morava Lua, dezenove anos, aprendiz de bruxa, dona de um caderno de feitiços que quase sempre davam errado.`,
`— Lua, pela terceira vez: a vassoura é para voar, não para varrer — resmungou Vovó Ágata.
— Mas ela varre tão bem, vó!
— Varre. E ainda canta. Essa é a parte que me preocupa.
Lua riu. A avó dizia que a magia da neta era "bonita demais para ser obediente". Talvez fosse esse o problema: Lua não sabia fazer magia pequena. Tudo nela transbordava.`,
`Naquela noite, a chuva chegou sem avisar. Lua fechava a livraria quando ouviu um miado fraco atrás da porta.
Ali, encharcado, havia um gato preto de olhos tão dourados que pareciam duas luas pequenas. Ele a olhou com dignidade ofendida, como quem diz: "Eu não estou perdido. Só não tenho para onde ir."
— Ah, entre logo, majestade — sussurrou ela.`,
`Ela o secou com uma toalha de estrelas bordadas. Ele permitiu, com a postura de um rei. Ganhou leite morno com canela e fez cara de quem preferia vinho.
— Vou te chamar de Sol — decidiu Lua. — Você chegou na noite mais escura do mês.
O gato piscou devagar. Por um segundo, ela jurou ter visto algo triste e muito antigo passar por aquele olhar.`,
`## Capítulo 2 · O gato que lia
Sol ficou. Em uma semana, já dormia sobre o balcão. Em duas, já escolhia os livros que Lua deveria ler: empurrava um da estante com a pata, e era sempre o melhor.
— Você é esquisito — dizia ela.
Ele respondia com um ronronar que soava, suspeitamente, como uma risada.`,
`Mirtilo, o gatinho cinza da padaria, vivia aparecendo para fofocar. Lua não entendia miados, mas entendia o bastante: toda vez que via Sol, Mirtilo baixava as orelhas numa reverência, como diante da realeza.
— Por que todo gato desta vila te respeita? — perguntou Lua.
Sol bocejou e fingiu não ouvir.`,
`Teo, o padeiro, entregava pão quente toda manhã e um olhar tímido que Lua nunca percebia.
— Seu gato me julga — disse ele, rindo.
— Ele julga todo mundo.
Do balcão, Sol apertou os olhos para Teo, depois para o pão, depois desviou o rosto. Ciúme? Fome? Ninguém soube dizer.`,
`Foi numa noite de lua cheia que tudo mudou. Lua acordou com o som de páginas virando sozinhas.
Desceu a escada de caracol, vela na mão, e viu a luz entrar pela claraboia. No meio da livraria, sentado no chão, havia um rapaz alto, de cabelos escuros e olhos dourados, segurando um dos livros dela com infinito cuidado.`,
`## Capítulo 3 · Meia-noite
— Você... — Lua deixou a vela cair; a chama se apagou sozinha. — Onde está o meu gato?
O rapaz se levantou devagar, mãos erguidas.
— Antes que você grite, preciso que acredite em uma coisa impossível.
— Nesta casa, eu acredito em quase tudo.
— Então acredite: eu sou o Sol.`,
`Ele contou tudo sentado na escada, enquanto ela fazia chá com as mãos tremendo. Era Sol de Aurélia, príncipe do Reino das Sete Luas, amaldiçoado pela tia, a Rainha Nyx, a viver como gato de dia e como homem apenas nas noites de lua cheia.
— Para sempre?
— Até que a maldição seja quebrada.`,
`— Quebrada como?
Ele olhou para as próprias mãos.
— O encanto só termina com um gesto de amor verdadeiro.
Lua sentiu o rosto arder.
— Um... gesto?
— Qualquer gesto! — disse ele, rápido demais. — Um abraço. Um gesto. Um... gesto.
Ele era péssimo em mentir. Sabia exatamente qual gesto. E ela, por algum motivo, também.`,
`Nas luas cheias seguintes, eles se encontravam entre as estantes. Ele lia em voz alta; ela corrigia a pronúncia dos nomes de bruxas antigas. Às vezes os dedos se tocavam ao alcançar o mesmo livro, e os dois fingiam que não era nada.
Numa dessas noites ele disse, baixinho:
— Há séculos eu não me sentia em casa em lugar nenhum.`,
`Na noite do Festival das Lanternas, ela o puxou para o telhado para ver as luzes subirem. Estavam tão perto que ela podia contar os cílios dele. Ele inclinou o rosto... ela fechou os olhos...
— MIAU!
Mirtilo despencou da chaminé em cima dos dois.
— Eu mato esse gato — murmurou Sol, vermelho.
— Você é um gato.
— Eu mato o OUTRO gato.`,
`Mas a paz não duraria. Naquela madrugada, um corvo bateu na janela com uma carta lacrada em preto:
"Querido sobrinho, sei onde você está. Em sete luas, eu mesma venho te buscar. — Nyx."
Sol empalideceu. Lua, pela primeira vez, sentiu medo. E, pela primeira vez, decidiu que ninguém o tiraria dali.`,
`## Capítulo 4 · O mapa de Vovó Ágata
Lua e Sol passaram a noite em claro, cercados de livros abertos. Quando a manhã chegou, o príncipe virou gato no meio de uma frase, caindo sentado num dicionário.
— Está tudo bem — disse Lua, contendo o riso.
Ele a encarou com a maior dignidade que um gato molhado de orgulho consegue.`,
`Vovó Ágata apareceu na porta com uma bolsa de viagem e uma chave de prata.
— Eu sabia desde a primeira noite. Nenhum gato lê com esse olhar de quem sente saudade de casa.
— A senhora SABIA? — gritou Lua.
— Claro. Eu só estava esperando você descobrir sozinha. Bruxas aprendem melhor assim.`,
`— Só existe uma coisa que quebra a magia da Nyx — explicou a avó. — O Cristal da Lua Nova, guardado pelos Gatos Anciãos. Mas ele só obedece a uma bruxa cuja magia transborda.
Lua olhou para o caderno de feitiços desastrados.
— Vó... então todo esse meu jeito de errar...
— Nunca foi erro, querida. Era tamanho.`,
`Teo chegou correndo com uma cesta de pães e Mirtilo pendurado no ombro.
— Eu vou junto.
— Você é padeiro! — disse Lua.
— E você, sozinha com um príncipe e um gato, vai precisar de lanche.
Sol, do colo dela, olhou o padeiro por um longo momento. Depois, pela primeira vez, ronronou para ele.`,
`Partiram ao amanhecer, com a vila inteira acenando. Lua levava Sol no ombro, Teo carregava o mapa, e Mirtilo, a fofoca.
Pela estrada, o céu ia de rosa a dourado. Lua pensou que nunca tinha saído de casa. Sol a cutucou com a patinha, como quem diz: "Você não está sozinha."
Ela sorriu e seguiu em frente.`,
`## Capítulo 5 · A floresta que ronronava
Na floresta dos Gatos Anciãos, as árvores ronronavam e as folhas caíam em silêncio, como se pedissem licença. Nove gatos enormes esperavam numa clareira, em círculo, de olhos fechados.
A maior, de pelo branco como a lua cheia, abriu um olho.
— Então esta é a bruxa. Pequena. Barulhenta. Interessante.`,
`— Chamo-me Pérola — disse a gata. — Para pegar o Cristal, mostre uma magia pequena.
— Pequena? — Lua engoliu em seco. — Eu... consigo.
Ergueu a mão para acender uma vela. A vela acendeu. Depois a clareira inteira acendeu. Depois choveu glitter. Depois uma árvore começou a cantar.
— Pequena — repetiu Pérola, seca. — Você disse.`,
`— Bela tentativa — disse uma voz sedosa.
Uma bruxa de cabelos prateados surgiu entre as árvores, com um vestido que parecia feito de fumaça.
— Odette — murmurou Lua. — Da Academia.
— Aprendiz de Nyx, agora. — Odette sorriu para Sol, o gato. — Ele já te contou o preço, querida? Não? Que pena. Ele sempre foi covarde.`,
`Naquela noite, a lua cheia deixou Sol humano de novo. Ele achou Lua sentada à beira do lago, chorando de vergonha.
— Eu quebrei uma floresta inteira — soluçou ela.
— Você fez uma árvore cantar. — Ele sentou ao lado dela. — É a coisa mais bonita que eu vi em trezentos anos de maldição.
Ela riu entre as lágrimas.`,
`Estavam tão perto que a respiração dos dois se misturava. A mão dele subiu para o rosto dela. Ela se inclinou...
Um trovão rasgou o céu e a chuva caiu como se alguém tivesse virado um balde.
— Odette — rosnou Sol.
Mesmo encharcados, não se soltaram. Ficaram ali, de mãos dadas, rindo e tremendo, olhos presos um no outro.`,
`— GUARDA-CHUVA! — gritou Teo, correndo pela margem.
Parou ao ver os dois. Viu as mãos dadas. Viu o brilho nos olhos de Lua, aquele que nunca era para ele.
Sorriu mesmo assim, abriu o guarda-chuva sobre os dois e disse apenas:
— Vocês vão pegar um resfriado.
O coração dele doeu, em silêncio, de um jeito muito educado.`,
`## Capítulo 6 · O preço
Pérola chamou Sol à clareira, ao amanhecer.
— O gesto de amor verdadeiro tem um preço, príncipe. Quem o dá entrega um pedaço da própria magia. A bruxa que te beijar pode perder o dom que a faz especial.
Sol não respondeu. O gato mais orgulhoso do reino baixou as orelhas como um filhote.`,
`À noite, ele encontrou Lua entre as estantes de pedra da floresta.
— Eu nunca vou te beijar — disse, sem olhar para ela. — Prefiro ser gato para sempre.
— Você não pode decidir por mim o que eu aceito perder!
— Posso decidir o que eu aceito te custar.
Ela o encarou, magoada. Ele virou as costas. Os dois choraram, cada um sozinho.`,
`Nos dias seguintes, o silêncio foi um terceiro viajante. De dia, Sol dormia no travesseiro dela e fingia não ronronar. À noite, lia longe, sob as estrelas, e fingia não olhar.
Lua fingia que não sentia falta dele. Teo fingia que não via.
Mirtilo, o único honesto do grupo, miava para qualquer um que ouvisse: "Vocês dois são ridículos."`,
`Então chegou um bilhete na letra de Sol: "Me encontre na gruta do Cristal. Venha sozinha. Preciso te explicar."
Lua leu três vezes. O coração disparou. Foi, de cabelo ainda desfeito, sem acordar ninguém.
Não notou que a letra estava um pouco bonita demais. Nem que um corvo preto a seguia, de galho em galho.`,
`## Capítulo 7 · A gruta do Cristal
A gruta brilhava em azul. No centro, flutuava o Cristal da Lua Nova, e ao lado dele, sorrindo, estava Odette.
— Que decepção, querida. O bilhete era meu.
— Onde está o Sol?
— Dormindo, de gato, onde sempre esteve. — Odette abriu os braços. — Nyx me prometeu o trono das bruxas. Entregue o Cristal e o príncipe, e eu te deixo voltar para a livraria.`,
`— Não — disse Lua.
— É a sua última chance.
— Eu aprendi uma coisa nesta viagem: ninguém precisa ser pequeno para ser bom.
Odette lançou um feitiço negro. Lua ergueu as mãos sem pensar, e a gruta explodiu em estrelas. Flores nasceram nas paredes. O teto virou céu. Odette cambaleou, de olhos arregalados. Lua desmaiou.`,
`Do lado de fora, Sol acordou de repente, como se tivesse ouvido o nome dela.
Era dia. Ele era gato. Não importava. Disparou pela floresta, e atrás dele, em fila, vieram os nove Gatos Anciãos, Mirtilo e um padeiro correndo com uma baguete como arma.
— Eu sei o que estou fazendo! — gritou Teo, sem saber.`,
`Quando chegaram, encontraram Odette ajoelhada diante de Lua desmaiada, tremendo.
— Eu só queria que alguém me achasse suficiente — sussurrou. — Nyx nunca achou.
Pérola aproximou-se devagar. Com uma pata, empurrou o Cristal na direção da bruxa de prata.
— Então comece sendo suficiente para si mesma. Depois, ajude esta menina.`,
`Lua acordou à noite, com a cabeça no colo de alguém. Sol, humano, de olhos vermelhos, não tinha dormido.
— Quase te perdi — disse ele, a voz quebrada.
— Eu estou aqui.
Ele encostou a testa na dela. O mundo ficou do tamanho dos dois. Mas no Cristal, uma voz ecoou, vinda de longe:
— As sete luas acabaram, sobrinho. Estou chegando.`,
`## Capítulo 8 · A Rainha das Sombras
O céu escureceu antes da hora. Uma figura alta desceu das nuvens, de manto cor de noite, coroa de sete luas apagadas.
Rainha Nyx tinha um rosto bonito e cansado, o rosto de quem passou muito tempo sozinha.
— Venha para casa, Sol.
— Não.
— Então levarei a vila. Uma por uma.`,
`Sol deu um passo à frente.
— Eu vou com a senhora. Mas a vila e Lua ficam em paz.
— Não! — Lua agarrou a manga dele.
— Lua. Por favor.
Ele a olhou como quem grava um rosto para sempre. Depois soltou, devagar, os dedos dela.
Nyx ergueu a mão. Houve um clarão, e quando a luz apagou, os dois haviam sumido.`,
`Lua ficou de joelhos, o chão frio sob as mãos. Teo a abraçou. Mirtilo se encolheu ao lado dela, tremendo.
Vovó Ágata apareceu pelo Cristal, de longe.
— Levante, neta. Magia que transborda também sabe voar.
Lua secou o rosto com a manga. Olhou a vassoura encostada na árvore.
— Então é hora de aprender.`,
`A vassoura cantou. Lua riu pela primeira vez em dias, e o riso a levantou do chão. Subiram juntas, a vassoura de voz desafinada, a bruxa de lágrimas no rosto, o padeiro agarrado na cauda e Mirtilo enfiado no capuz.
Rumo ao leste, onde o céu tinha sete luas.
E uma delas, bem pequena, estava apagada.`,
`## Capítulo 9 · O Reino das Sete Luas
Aurélia era feita de torres de vidro e jardins que dormiam de dia. No céu, seis luas brilhavam. A sétima, a do Sol, estava escura.
Lua entrou no palácio disfarçada de arrumadeira. Teo, de cozinheiro. Mirtilo, de gato, o que foi o único disfarce perfeito.
— Em que ala ele está? — sussurrou ela.
Mirtilo foi na frente.`,
`Sol estava num jardim fechado, preso por correntes de sombra, de volta ao seu rosto humano e frágil.
— Lua? — ele sussurrou, sem acreditar. — Você é louca.
— Eu sei. — Ela cortou as correntes com um feitiço que chovia glitter. — Vim te buscar.
— Eu te disse que o preço...
— E eu te disse: quem decide sou eu.`,
`A voz de Nyx cortou a noite:
— Que cena comovente.
Ela estava na porta do jardim, sozinha, sem guardas.
— Deixe-os em paz — disse Lua, encarando a rainha. — A senhora não amaldiçoou o sobrinho. A senhora amaldiçoou a própria solidão.
Nyx perdeu a cor. Por um instante, pareceu muito, muito jovem.`,
`— Eu amei uma vez — disse Nyx, devagar. — Ela partiu antes de eu poder dizer. E aprendi que amar custa tudo.
— Custa — disse Lua. — E devolve em dobro. A magia que se dá por amor nunca some, majestade. Ela volta maior.
— Como pode saber?
— Porque o meu transborda. Desde que o Sol chegou, ele nunca foi tão grande.`,
`## Capítulo 10 · O gesto de amor
Nyx fechou os olhos. Uma lágrima de prata rolou pelo rosto dela.
— Eu nunca ousei pagar esse preço. Mas você ousa.
Ela ergueu as mãos. As sete luas tremeram. As correntes viraram pó. A maldição se desfez como neve ao sol, não por um beijo, mas por uma tia que enfim decidiu perdoar.
Sol caiu de joelhos, livre.`,
`Pela primeira vez em séculos, o dia o encontrou humano. A luz do amanhecer tocou o rosto dele, e a sétima lua se acendeu, a mais brilhante de todas.
Teo aplaudiu da porta, de cozinheiro, chorando. Mirtilo miou. Odette, na ponta do corredor, entre arrependida e esperançosa, ergueu a mão num pedido de desculpas.
Lua riu, chorou e abraçou todo mundo.`,
`Um mês depois, a Vila das Lanternas sabia de tudo e fingia que não. A livraria ronronava mais alto do que nunca. Sol recusou o trono, entregou Aurélia ao conselho de Nyx e voltou "só para uma temporada".
A temporada durou o resto da vida.
Ele agora lia com Lua toda noite, e de dia também, sem ser gato.`,
`Teo e Odette, por incrível que pareça, tinham começado a assar pão juntos. "Pão com feitiço", dizia o cartaz. Vendia tanto que a fila dava a volta na praça.
Vovó Ágata, regando as plantas, olhou para o neto de coração e a neta, que riam nas escadas da livraria.
— Aposto que ainda não se beijaram.
Mirtilo, deitado ao lado, miou concordando.`,
`Na noite do Festival das Lanternas, Lua e Sol subiram ao telhado. Lá embaixo, Teo segurava Mirtilo pelo cangote, de olhar severo: "Hoje, não."
Silêncio. Nenhum trovão. Nenhum gato. Só as lanternas subindo, uma a uma, como pequenas luas.
— Agora não é maldição — disse Sol. — É escolha.
— Eu sei — sussurrou Lua. — É a que eu faria mil vezes.`,
`Ele segurou o rosto dela com as duas mãos, como se fosse feito de magia. Ela fechou os olhos. As lanternas viraram estrelas. A livraria, lá embaixo, ronronou tão forte que o telhado tremeu.
E, enfim, sem ninguém para interromper, eles se beijaram.
E foi o primeiro beijo.
E a lua, bem baixinho, ficou ainda mais perto.
*Fim*`

}
function idbRestore(cb){
  var done=false;function fin(){if(done)return;done=true;cb();}setTimeout(fin,1800);

    if(!db)return fin();

}

}

  if(DEF){DEF.prompt();return;}

  else st='<li>Toque no menu <b>⋮</b> do navegador.</li><li>Escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</li><li>Abra sempre pelo ícone 🌙.</li>';

  document.body.appendChild(m);
}
function bkHtml(){return '<div style="text-align:center;margin:20px 0 8px"><div style="font-size:12px;color:var(--mut);margin-bottom:8px">Segurança dos seus dados</div><button class="sm" onclick="bkExport()">💾 Copiar backup</button> <button class="sm" onclick="bkImport()">♻️ Restaurar backup</button></div>';}
function bkExport(){
  var j=btoa(unescape(encodeURIComponent(JSON.stringify(S)))),ok=function(){alert('Backup copiado! Cole em um lugar seguro (Notas, ou mande para você mesma no WhatsApp).');};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(j).then(ok,function(){prompt('Copie este código e guarde:',j);});else prompt('Copie este código e guarde:',j);
}
function bkImport(){
  var c=prompt('Cole aqui o código do backup:');if(!c)return;
  try{var d=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));if(!d||(!d.books&&!d.quotes&&!d.authors))throw 0;for(var k in d)S[k]=d[k];S.tab='lendo';save();render();alert('Backup restaurado! 💛');}
  catch(e){alert('Não consegui ler esse código. Cole o código completo, sem espaços a mais.');}
}
